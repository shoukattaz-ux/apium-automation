# Tests on every push / PR, and builds the Windows app + installer on GitHub's Windows machines.
#
# Download the results from the run's "Artifacts" section:
#   DeviceAutomation-Setup-<version>   the installer (.exe)
#   DeviceAutomation-portable-<version> the one-folder build, zipped
#
# Appium, Node and adb are bundled (packaging/prepare_bundle.ps1) on pushes to main,
# version tags and manual runs, so end users install nothing. PR builds skip that
# step to stay fast. Pushing a tag like v1.1.0 also publishes a GitHub Release.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_appium:
        description: "Bundle Node + Appium + adb into the build"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes core ui main.py tests packaging/make_icon.py
      - name: Tests
        run: python -m pytest -q

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    needs: test
    env:
      QT_QPA_PLATFORM: offscreen
      BUNDLE_APPIUM: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_appium || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests (Windows)
        run: python -m pytest -q
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Bundle Node + Appium + adb
        if: env.BUNDLE_APPIUM == 'true'
        shell: pwsh
        run: ./packaging/prepare_bundle.ps1
      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/apium_automation.spec
      - name: Check the build
        shell: pwsh
        run: |
          # The .exe is windowed (no console), so check its file properties rather than --version output.
          $exe = Get-Item dist/DeviceAutomation/DeviceAutomation.exe
          $info = $exe.VersionInfo
          "Product: $($info.ProductName) $($info.ProductVersion), $([math]::Round($exe.Length / 1MB, 1)) MB"
          if ($info.ProductVersion -ne "${{ steps.version.outputs.version }}") { throw "Version not stamped into the .exe" }
          foreach ($path in "configs", "README.txt", "_internal/assets/icon.ico", "_internal/default_configs") {
            if (-not (Test-Path "dist/DeviceAutomation/$path")) { throw "Missing from build: $path" }
          }
          # Run the packaged app's self-test: imports what a phone connection needs (catches
          # modules or package metadata PyInstaller left out) and checks the bundled tools.
          $proc = Start-Process dist/DeviceAutomation/DeviceAutomation.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist/DeviceAutomation/logs/self-test.txt
          if ($proc.ExitCode -ne 0) { throw "Packaged app self-test failed (exit $($proc.ExitCode))" }
          if ($env:BUNDLE_APPIUM -eq "true") {
            $report = Get-Content dist/DeviceAutomation/logs/self-test.txt -Raw | ConvertFrom-Json
            if ($report.checks.bundled_tools -notmatch "node.exe") { throw "Bundled Appium not found by the app" }
          }
          Remove-Item -Recurse -Force dist/DeviceAutomation/logs
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Test upgrading over a running install
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Reproduces "DeleteFile failed; code 5" on AdbWinApi.dll: the app's adb server keeps
          # running after the app closes and locks its files. The installer must stop it.
          $setup = (Get-ChildItem dist/installer/*.exe | Select-Object -First 1).FullName
          $app = "$env:LOCALAPPDATA\Programs\Device Automation Dashboard"
          function Install($log) {
            # WaitForExit, not Start-Process -Wait: -Wait also waits for every child process.
            $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/LOG=$log" -PassThru
            if (-not $p.WaitForExit(300000)) { Get-Content $log -Tail 40; throw "Install did not finish in 5 minutes" }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Install failed (exit $($p.ExitCode))" }
            "Installed ($log)"
          }
          Install "$env:RUNNER_TEMP\install1.log"
          if (Test-Path "$app\platform-tools\adb.exe") {
            # Not -Wait: the adb server it starts keeps running in the background (that's the point).
            Start-Process "$app\platform-tools\adb.exe" -ArgumentList "start-server" -WindowStyle Hidden
            $running = $null
            for ($i = 0; $i -lt 30 -and -not $running; $i++) {
              Start-Sleep -Seconds 1
              $running = Get-Process adb -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app\*" }
            }
            if (-not $running) { throw "Test setup: adb server did not start" }
            "adb server running from the install folder (pid $($running.Id -join ', '))"
          }
          Install "$env:RUNNER_TEMP\install2.log"
          "Upgrade over a running install succeeded"
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $u.WaitForExit(300000)) { throw "Uninstall did not finish in 5 minutes" }
          Start-Sleep -Seconds 3  # the uninstaller hands off to a temporary copy of itself
          if (Get-Process adb -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app\*" }) { throw "adb still running after uninstall" }
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist/DeviceAutomation/* -DestinationPath "dist/DeviceAutomation-portable-${{ steps.version.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceAutomation-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceAutomation-portable-${{ steps.version.outputs.version }}
          path: dist/DeviceAutomation-portable-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
